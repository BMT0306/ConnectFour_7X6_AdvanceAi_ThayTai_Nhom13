[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c4"
version = "0.1.0"
description = "Connect Four Game AI - đồ án cuối kỳ Trí tuệ nhân tạo nâng cao"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "pygame>=2.5",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
